name: dockside

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dockside
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dockside
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockside -d dockside"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${REGISTRY:-docker.io}/${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE in .env}/dockside-api:${API_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://dockside:${POSTGRES_PASSWORD}@db:5432/dockside
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"

  web:
    image: ${REGISTRY:-docker.io}/${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE in .env}/dockside-web:${WEB_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pg-data:
